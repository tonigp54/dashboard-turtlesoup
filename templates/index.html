<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Turtle Soup - En Vivo</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #12151e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
        }
        h1 { text-align: center; color: #4e92df; margin-bottom: 20px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .card {
            background: #1e222d;
            border-radius: 8px;
            padding: 10px;
            border: 2px solid #2a2e39;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card.barrido-top { border-color: #ff5252; animation: blink 1s infinite; }
        .card.barrido-bottom { border-color: #00e676; animation: blink 1s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        .chart-container { height: 180px; width: 100%; }
    </style>
</head>
<body>

    <h1>🐢 DASHBOARD TURTLE SOUP (H4 EN VIVO)</h1>
    <div class="grid-container" id="dashboard"></div>

    <script>
        const socket = io();
        const charts = {};
        const series = {};

        function renderPar(par, info) {
            const container = document.getElementById('dashboard');
            const cleanId = par.replace('/', '');

            if (!charts[par]) {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${cleanId}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span>${par}</span>
                        <span id="status-${cleanId}" style="font-size: 0.8em; color: #888;">Monitoreando...</span>
                    </div>
                    <div class="chart-container" id="chart-${cleanId}"></div>
                `;
                container.appendChild(card);

                const chart = LightweightCharts.createChart(document.getElementById(`chart-${cleanId}`), {
                    layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
                    grid: { vertLines: { color: '#2b2f3a' }, horzLines: { color: '#2b2f3a' } },
                    timeScale: { timeVisible: true, secondsVisible: false }
                });

                const candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#26a69a', downColor: '#ef5350',
                    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                    wickUpColor: '#26a69a', wickDownColor: '#ef5350'
                });

                charts[par] = chart;
                series[par] = candlestickSeries;
            }

            // Convertir fechas a timestamps para TradingView
            const formattedCandles = info.candles.map(c => ({
                time: new Date(c.time).getTime() / 1000,
                open: c.open,
                high: c.high,
                low: c.low,
                close: c.close
            }));

            series[par].setData(formattedCandles);

            const cardElement = document.getElementById(`card-${cleanId}`);
            const statusElement = document.getElementById(`status-${cleanId}`);

            cardElement.classList.remove('barrido-top', 'barrido-bottom');
            if (info.barrido_high) {
                cardElement.classList.add('barrido-top');
                statusElement.innerHTML = "🚨 BARRIDO MÁXIMO";
                statusElement.style.color = "#ff5252";
            } else if (info.barrido_low) {
                cardElement.classList.add('barrido-bottom');
                statusElement.innerHTML = "🚨 BARRIDO MÍNIMO";
                statusElement.style.color = "#00e676";
            } else {
                statusElement.innerHTML = "Normal";
                statusElement.style.color = "#888";
            }
        }

        socket.on('update_single', (data) => {
            for (const [par, info] of Object.entries(data)) {
                renderPar(par, info);
            }
        });

        socket.on('update_all', (data) => {
            for (const [par, info] of Object.entries(data)) {
                renderPar(par, info);
            }
        });
    </script>
</body>
</html>
