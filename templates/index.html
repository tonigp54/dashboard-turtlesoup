<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Turtle Soup - Matriz 20 Pares</title>
    <style>
        body {
            background-color: #12151e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
        }
        h1 { 
            text-align: center; 
            color: #4e92df; 
            margin-bottom: 20px; 
            font-size: 1.6em;
        }

        /* MATRIZ FIJA DE 5 COLUMNAS */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
        }

        @media (max-width: 1400px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 1100px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px)  { .grid-container { grid-template-columns: repeat(1, 1fr); } }

        .card {
            background: #1e222d;
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #2a2e39;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 220px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.85em;
            padding: 4px 6px;
            border-bottom: 1px solid #2a2e39;
            margin-bottom: 4px;
        }

        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>🐢 DASHBOARD TURTLE SOUP (MATRIZ 20 PARES H4)</h1>
    <div class="grid-container" id="dashboard"></div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const PARES = [
            { nombre: "EUR/USD", symbol: "FX:EURUSD" },
            { nombre: "GBP/USD", symbol: "FX:GBPUSD" },
            { nombre: "USD/JPY", symbol: "FX:USDJPY" },
            { nombre: "AUD/USD", symbol: "FX:AUDUSD" },
            { nombre: "NZD/USD", symbol: "FX:NZDUSD" },
            { nombre: "USD/CAD", symbol: "FX:USDCAD" },
            { nombre: "USD/CHF", symbol: "FX:USDCHF" },
            { nombre: "EUR/GBP", symbol: "FX:EURGBP" },
            { nombre: "EUR/JPY", symbol: "FX:EURJPY" },
            { nombre: "GBP/JPY", symbol: "FX:GBPJPY" },
            { nombre: "EUR/CAD", symbol: "FX:EURCAD" },
            { nombre: "AUD/JPY", symbol: "FX:AUDJPY" },
            { nombre: "GBP/AUD", symbol: "FX:GBPAUD" },
            { nombre: "EUR/AUD", symbol: "FX:EURAUD" },
            { nombre: "USD/MXN", symbol: "FX:USDMXN" },
            { nombre: "USD/ZAR", symbol: "FX:USDZAR" },
            { nombre: "USD/NOK", symbol: "FX:USDNOK" },
            { nombre: "USD/SEK", symbol: "FX:USDSEK" },
            { nombre: "USD/TRY", symbol: "FX:USDTRY" },
            { nombre: "USD/SGD", symbol: "FX:USDSGD" }
        ];

        function initDashboard() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            PARES.forEach((par, index) => {
                const containerId = `tv_chart_${index}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${par.nombre}</span>
                        <span style="color:#4e92df; font-size:0.8em;">H4</span>
                    </div>
                    <div id="${containerId}" class="tradingview-widget-container"></div>
                `;
                container.appendChild(card);

                // Carga directa del widget nativo de TradingView
                new TradingView.widget({
                    "autosize": true,
                    "symbol": par.symbol,
                    "interval": "240", // 240 minutos = 4 Horas (H4)
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1", // Velas japonesas
                    "locale": "es",
                    "toolbar_bg": "#f1f3f6",
                    "enable_publishing": false,
                    "hide_top_toolbar": true,
                    "hide_legend": true,
                    "save_image": false,
                    "container_id": containerId
                });
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
