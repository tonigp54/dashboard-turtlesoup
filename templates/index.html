<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Turtle Soup - 20 Pares H4</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #12151e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
        }
        h1 { text-align: center; color: #4e92df; margin-bottom: 20px; font-size: 1.6em; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (max-width: 1200px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .grid-container { grid-template-columns: repeat(1, 1fr); } }

        .card {
            background: #1e222d;
            border-radius: 8px;
            padding: 8px;
            border: 2px solid #2a2e39;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card.barrido-top { border-color: #ff5252; animation: blink 1s infinite; }
        .card.barrido-bottom { border-color: #00e676; animation: blink 1s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2e39;
        }
        .status-tag {
            font-size: 0.75em;
            padding: 2px 5px;
            border-radius: 4px;
            background: #2a2e39;
            color: #888;
        }
        .chart-container { height: 150px; width: 100%; }
    </style>
</head>
<body>

    <h1>🐢 DASHBOARD TURTLE SOUP (MATRIZ 20 PARES H4)</h1>
    <div class="grid-container" id="dashboard"></div>

    <script>
        const PARES = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "NZD/USD", "USD/CAD", "USD/CHF",
            "EUR/GBP", "EUR/JPY", "GBP/JPY", "EUR/CAD", "AUD/JPY", "GBP/AUD", "EUR/AUD",
            "USD/MXN", "USD/ZAR", "USD/NOK", "USD/SEK", "USD/TRY", "USD/SGD"
        ];

        const charts = {};
        const series = {};

        function initDOM() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            PARES.forEach(par => {
                const cleanId = par.replace('/', '_');
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${cleanId}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span>${par}</span>
                        <span class="status-tag" id="status-${cleanId}">Conectando...</span>
                    </div>
                    <div class="chart-container" id="chart-${cleanId}"></div>
                `;
                container.appendChild(card);
            });
        }

        function initCharts() {
            PARES.forEach(par => {
                const cleanId = par.replace('/', '_');
                const chartElement = document.getElementById(`chart-${cleanId}`);
                
                if (chartElement && typeof LightweightCharts !== 'undefined') {
                    try {
                        const chart = LightweightCharts.createChart(chartElement, {
                            layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#2b2f3a' }, horzLines: { color: '#2b2f3a' } },
                            timeScale: { timeVisible: true, secondsVisible: false }
                        });

                        const candlestickSeries = chart.addCandlestickSeries({
                            upColor: '#26a69a', downColor: '#ef5350',
                            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
                        });

                        charts[par] = chart;
                        series[par] = candlestickSeries;
                    } catch (e) {
                        console.error(`Error ${par}:`, e);
                    }
                }
            });
        }

        initDOM();
        setTimeout(initCharts, 200);

        const socket = io();

        function updateParData(par, info) {
            if (!series[par]) return;

            const cleanId = par.replace('/', '_');

            if (info.candles && info.candles.length > 0) {
                const formattedCandles = info.candles.map(c => ({
                    time: c.time,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));

                series[par].setData(formattedCandles);
            }

            const cardElement = document.getElementById(`card-${cleanId}`);
            const statusElement = document.getElementById(`status-${cleanId}`);

            if (cardElement && statusElement) {
                cardElement.classList.remove('barrido-top', 'barrido-bottom');
                
                if (info.barrido_high) {
                    cardElement.classList.add('barrido-top');
                    statusElement.innerHTML = "🚨 BARRIDO MÁXIMO";
                    statusElement.style.color = "#ff5252";
                } else if (info.barrido_low) {
                    cardElement.classList.add('barrido-bottom');
                    statusElement.innerHTML = "🚨 BARRIDO MÍNIMO";
                    statusElement.style.color = "#00e676";
                } else {
                    statusElement.innerHTML = "Monitoreando";
                    statusElement.style.color = "#888";
                }
            }
        }

        socket.on('update_single', (data) => {
            for (const [par, info] of Object.entries(data)) {
                updateParData(par, info);
            }
        });

        socket.on('update_all', (data) => {
            for (const [par, info] of Object.entries(data)) {
                updateParData(par, info);
            }
        });
    </script>
</body>
</html>
